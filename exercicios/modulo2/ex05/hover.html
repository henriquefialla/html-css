<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de hover</title>
    <style>
        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        div > p {
            display: none;
        }
        div:hover > p {
            display: block;
            color: blue;
            background-color: crimson;
        }
    </style>
</head>
<body>
   <h1>exemplo de hover</h1>
    <p>passa o mouse ai</p>
    <div>passa o mouse aq
    <p>texto escondido</p>
    </div>
    <p>fim do exemplo</p>
</body>
</html>
